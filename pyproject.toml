[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "market-signal-lab"
version = "1.0.0"
description = "An educational Python toolkit for technical indicators, explainable market signals, and bias-aware backtesting."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Robert Pelot" }]
keywords = ["python", "pandas", "technical-analysis", "backtesting", "portfolio-project"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = [
    "duckdb>=1.1,<2",
    "numpy>=1.26,<3",
    "pandas>=2.1,<3",
]

[project.optional-dependencies]
dev = ["ruff>=0.8"]

[project.scripts]
market-signal-lab = "market_signal_lab.cli:main"

[project.urls]
Repository = "https://github.com/Robert-Pelot/MarketSignalLab"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
